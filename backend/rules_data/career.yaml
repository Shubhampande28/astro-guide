- id: CAR-001
  topic: career
  condition: lord(10) in house(1)
  weight: 4
  effect:
    en: The lord of the 10th house placed in the 1st house supports career.
    hi: 10th भाव का स्वामी 1st भाव में होने से करियर पर प्रभाव पड़ता है।
