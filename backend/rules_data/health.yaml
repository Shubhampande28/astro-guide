- id: HEA-001
  topic: health
  condition: lord(6) in house(1)
  weight: 4
  effect:
    en: The lord of the 6th house placed in the 1st house supports health.
    hi: 6th भाव का स्वामी 1st भाव में होने से स्वास्थ्य पर प्रभाव पड़ता है।
    hinglish: 6th house ka swami 1st house mein hone se health par asar padta hai.
