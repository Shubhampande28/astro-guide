- id: CHI-001
  topic: children
  condition: lord(5) in house(1)
  weight: 4
  effect:
    en: The lord of the 5th house placed in the 1st house supports children.
    hi: 5th भाव का स्वामी 1st भाव में होने से संतान पर प्रभाव पड़ता है।
    hinglish: 5th house ka swami 1st house mein hone se bachche par asar padta hai.
  source:
    book: Brihat Parashara Hora Shastra
    chapter: ''
    verse: ''
  remedies: []
  status: draft
