- id: MON-001
  topic: money
  condition: lord(2) in house(1)
  weight: 4
  effect:
    en: The lord of the 2nd house placed in the 1st house supports wealth.
    hi: 2nd भाव का स्वामी 1st भाव में होने से धन पर प्रभाव पड़ता है।
    hinglish: 2nd house ka swami 1st house mein hone se paisa par asar padta hai.
  source:
    book: Brihat Parashara Hora Shastra
    chapter: ''
    verse: ''
  remedies: []
