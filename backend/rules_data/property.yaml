- id: PRO-001
  topic: property
  condition: lord(4) in house(1)
  weight: 4
  effect:
    en: The lord of the 4th house placed in the 1st house supports property.
    hi: 4th भाव का स्वामी 1st भाव में होने से संपत्ति पर प्रभाव पड़ता है।
    hinglish: 4th house ka swami 1st house mein hone se property par asar padta hai.
  source:
    book: Brihat Parashara Hora Shastra
    chapter: ''
    verse: ''
  remedies: []
