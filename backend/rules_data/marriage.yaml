- id: MAR-001
  topic: marriage
  condition: lord(7) in house(1)
  weight: 4
  effect:
    en: The lord of the 7th house placed in the 1st house supports marriage.
    hi: 7th भाव का स्वामी 1st भाव में होने से विवाह पर प्रभाव पड़ता है।
    hinglish: 7th house ka swami 1st house mein hone se shaadi par asar padta hai.
  source:
