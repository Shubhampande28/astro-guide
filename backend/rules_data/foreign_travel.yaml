- id: FOR-001
  topic: foreign_travel
  condition: lord(12) in house(1)
  weight: 4
  effect:
    en: The lord of the 12th house placed in the 1st house supports foreign travel.
    hi: 12th भाव का स्वामी 1st भाव में होने से विदेश यात्रा पर प्रभाव पड़ता है।
    hinglish: 12th house ka swami 1st house mein hone se videsh yatra par asar padta
      hai.
  source:
    book: Brihat Parashara Hora Shastra
    chapter: ''
    verse: ''
  remedies: []
  status: draft
